name: Deploy Backend

on:
  push:
    branches: [main]
    paths:
      - server/**
      - .github/workflows/deploy-backend.yml

concurrency:
  group: deploy-backend-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

jobs:
  build:
    name: Build ${{ matrix.arch }} image
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-latest
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4

      - name: Set image names
        working-directory: server
        env:
          OWNER: ${{ github.repository_owner }}
          SHA: ${{ github.sha }}
        run: |
          owner_lc="${OWNER,,}"
          short="${SHA::7}"
          image="ghcr.io/${owner_lc}/dstc-matching"
          echo "IMAGE=${image}" >> "$GITHUB_ENV"
          echo "SHORT_SHA=${short}" >> "$GITHUB_ENV"

      - name: Log in to GHCR
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" \
            | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Build and push ${{ matrix.arch }} image
        working-directory: server
        env:
          SHA: ${{ github.sha }}
          ARCH: ${{ matrix.arch }}
        run: |
          docker build \
            --build-arg "GIT_SHA=${SHORT_SHA}" \
            --tag "${IMAGE}:latest-${ARCH}" \
            --tag "${IMAGE}:${SHA}-${ARCH}" \
            --tag "${IMAGE}:sha-${SHORT_SHA}-${ARCH}" \
            -f Containerfile .
          docker push "${IMAGE}:latest-${ARCH}"
          docker push "${IMAGE}:${SHA}-${ARCH}"
          docker push "${IMAGE}:sha-${SHORT_SHA}-${ARCH}"

  publish:
    name: Publish multi-architecture image
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Set image names
        env:
          OWNER: ${{ github.repository_owner }}
          SHA: ${{ github.sha }}
        run: |
          owner_lc="${OWNER,,}"
          echo "IMAGE=ghcr.io/${owner_lc}/dstc-matching" >> "$GITHUB_ENV"
          echo "SHORT_SHA=${SHA::7}" >> "$GITHUB_ENV"

      - name: Log in to GHCR
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" \
            | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Create and push multi-architecture manifests
        env:
          SHA: ${{ github.sha }}
        run: |
          sources=("${IMAGE}:latest-amd64" "${IMAGE}:latest-arm64")
          docker buildx imagetools create \
            --tag "${IMAGE}:latest" \
            --tag "${IMAGE}:${SHA}" \
            --tag "${IMAGE}:sha-${SHORT_SHA}" \
            "${sources[@]}"

