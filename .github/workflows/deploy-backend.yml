name: Deploy Backend

on:
  push:
    branches: [main]
    paths:
      - server/**
      - .github/workflows/deploy-backend.yml

concurrency:
  group: deploy-backend-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Build image
        working-directory: server
        env:
          OWNER: ${{ github.repository_owner }}
          SHA: ${{ github.sha }}
        run: |
          owner_lc="${OWNER,,}"
          short="${SHA::7}"
          image="ghcr.io/${owner_lc}/dstc-matching"
          echo "IMAGE=${image}" >> "$GITHUB_ENV"
          echo "SHORT_SHA=${short}" >> "$GITHUB_ENV"
          docker build \
            --build-arg "GIT_SHA=${short}" \
            --tag "${image}:latest" \
            --tag "${image}:${SHA}" \
            --tag "${image}:sha-${short}" \
            -f Containerfile .

      - name: Log in to GHCR
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" \
            | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Push to GHCR
        run: |
          docker push "${IMAGE}:latest"
          docker push "${IMAGE}:${{ github.sha }}"
          docker push "${IMAGE}:sha-${SHORT_SHA}"

      - name: Deploy to production
        uses: appleboy/ssh-action@7e0a2d82ba5b45e3aa4efd5d424aafc59c2cb3a0 # v1.2.2
        with:
          host: mainframe.cteftu.id.vn
          username: root
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            cd /apps
            bash deploy.sh 2>&1 | tee /tmp/deploy.log
            EXIT=${PIPESTATUS[0]}
            echo "--- deploy.sh output above ---"
            exit $EXIT

      - name: Verify deployment
        uses: appleboy/ssh-action@7e0a2d82ba5b45e3aa4efd5d424aafc59c2cb3a0 # v1.2.2
        with:
          host: mainframe.cteftu.id.vn
          username: root
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            for i in $(seq 1 5); do
              HEALTH=$(curl -s -w "\n%{http_code}" https://matching-api.cteftu.id.vn/health) && \
              CODE=$(echo "$HEALTH" | tail -1) && \
              BODY=$(echo "$HEALTH" | sed '$d') && \
              COMMIT=$(echo "$BODY" | jq -r '.commit // empty') && \
              [ "$CODE" = "200" ] && [ -n "$COMMIT" ] && break
              echo "Retry ${i}/5 — HTTP ${CODE}, body: ${BODY}"
              sleep 3
            done
            echo "Health response: ${BODY}"
            echo "Expected: ${{ env.SHORT_SHA }}"
            echo "Got:      ${COMMIT:-<empty>}"
            if [ "$COMMIT" != "${{ env.SHORT_SHA }}" ]; then
              echo "ERROR: commit mismatch!"
              exit 1
            fi
            echo "Deployment verified ✓"

      - name: Summary
        run: |
          {
            echo "### Backend image pushed"
            echo ""
            echo "\`${IMAGE}:latest\`"
            echo "\`${IMAGE}:sha-${SHORT_SHA}\`"
          } >> "$GITHUB_STEP_SUMMARY"